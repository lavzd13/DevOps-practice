services:
  app:
    build:
      context: app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000
    env_file:
      - .env
    networks:
      - app_network

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    env_file:
      - .env
    networks:
      - app_network
    volumes:
      - ./entrypoint.sql:/docker-entrypoint-initdb.d/entrypoint.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  app_network: